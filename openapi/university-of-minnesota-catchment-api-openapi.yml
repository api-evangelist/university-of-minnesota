openapi: 3.2.0
info:
  title: hydro Catchment API
  description: Hydrological Datasets
  contact:
    name: GEMS
    url: https://gems.umn.edu/exchange
    email: gemssupport@umn.edu
  version: '2.0'
servers:
- url: /hydro/v2
tags:
- name: catchment
paths:
  /catchment/search/point:
    get:
      tags:
      - catchment
      summary: Get Search Catchment Point
      description: Find the catchment that contains a lat/lon point of interest.
      operationId: get_search_catchment_point_catchment_search_point_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 85.0445664
          minimum: -85.0445664
          description: Latitude of point of interest.
          title: Lat
        description: Latitude of point of interest.
        example: 45.9592
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180.0
          minimum: -180.0
          description: Longitude of point of interest.
          title: Lon
        description: Longitude of point of interest.
        example: -93.6146
      - name: mndnr_level
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MNDNRLevel'
          - type: 'null'
          description: HUC level as defined by the Minnesota DNR.
          default: 9
          title: Mndnr Level
        description: HUC level as defined by the Minnesota DNR.
      - name: apikey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: apikey
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/CatchmentOut09'
                - $ref: '#/components/schemas/CatchmentOut08'
                - $ref: '#/components/schemas/CatchmentOut07'
                - $ref: '#/components/schemas/CatchmentOut04'
                - $ref: '#/components/schemas/CatchmentOut02'
                - $ref: '#/components/schemas/CatchmentOut01'
                - type: 'null'
                title: Response Get Search Catchment Point Catchment Search Point Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /catchment/search:
    get:
      tags:
      - catchment
      summary: Get Search Catchment Bbox
      description: Find the catchment that contains a lat/lon point of interest.
      operationId: get_search_catchment_bbox_catchment_search_get
      parameters:
      - name: bbox
        in: query
        required: true
        schema:
          type: string
          pattern: ^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$
          description: 'Bounding box filter. Format: minx,miny,maxx,maxy'
          title: Bbox
        description: 'Bounding box filter. Format: minx,miny,maxx,maxy'
        example: -97.2,43.4,-89.4,49.3
      - name: mndnr_level
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MNDNRLevel'
          - type: 'null'
          description: HUC level as defined by the Minnesota DNR.
          default: 9
          title: Mndnr Level
        description: HUC level as defined by the Minnesota DNR.
      - name: offset
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Result number offset. Use with 'limit' parameter to obtain all results.
          default: 0
          title: Offset
        description: Result number offset. Use with 'limit' parameter to obtain all results.
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 300
          - type: 'null'
          description: 'Pagination: maximum number of returned objects.'
          default: 100
          title: Limit
        description: 'Pagination: maximum number of returned objects.'
      - name: apikey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: apikey
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    anyOf:
                    - $ref: '#/components/schemas/CatchmentOut09'
                    - $ref: '#/components/schemas/CatchmentOut08'
                    - $ref: '#/components/schemas/CatchmentOut07'
                    - $ref: '#/components/schemas/CatchmentOut04'
                    - $ref: '#/components/schemas/CatchmentOut02'
                    - $ref: '#/components/schemas/CatchmentOut01'
                - type: 'null'
                title: Response Get Search Catchment Bbox Catchment Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - catchment
      summary: Post Search Catchment
      description: Find a catchment(s) that intersect your geometry of interest. Geometry must be valid GeoJSON Point, Polygon or MultiPolygon.
      operationId: post_search_catchment_catchment_search_post
      parameters:
      - name: mndnr_level
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MNDNRLevel'
          - type: 'null'
          description: HUC level as defined by the Minnesota DNR.
          default: 9
          title: Mndnr Level
        description: HUC level as defined by the Minnesota DNR.
      - name: offset
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Result number offset. Use with 'limit' parameter to obtain all results.
          default: 0
          title: Offset
        description: Result number offset. Use with 'limit' parameter to obtain all results.
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 300
          - type: 'null'
          description: 'Pagination: maximum number of returned objects.'
          default: 100
          title: Limit
        description: 'Pagination: maximum number of returned objects.'
      - name: apikey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: apikey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                additionalProperties: true
                example:
                  type: MultiPolygon
                  coordinates:
                  - - - - -93.56866141384278
                        - 48.27239561689682
                      - - -93.74651022075412
                        - 47.95575515478085
                      - - -93.26113118522528
                        - 47.49466006006172
                      - - -91.31961504310993
                        - 47.46961968985513
                      - - -90.98985371362852
                        - 47.756863557224186
                      - - -91.54933641870373
                        - 48.14894016189724
                      - - -93.56866141384278
                        - 48.27239561689682
              - type: object
                additionalProperties: true
                example:
                  type: Polygon
                  coordinates:
                  - - - -93.56866141384278
                      - 48.27239561689682
                    - - -93.74651022075412
                      - 47.95575515478085
                    - - -93.26113118522528
                      - 47.49466006006172
                    - - -91.31961504310993
                      - 47.46961968985513
                    - - -90.98985371362852
                      - 47.756863557224186
                    - - -91.54933641870373
                      - 48.14894016189724
                    - - -93.56866141384278
                      - 48.27239561689682
              - type: object
                additionalProperties: true
                example:
                  type: Point
                  coordinates:
                  - 0
                  - 0
              title: Geojson
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/CatchmentOut09'
                - type: array
                  items:
                    $ref: '#/components/schemas/CatchmentOut08'
                - type: array
                  items:
                    $ref: '#/components/schemas/CatchmentOut07'
                - type: array
                  items:
                    $ref: '#/components/schemas/CatchmentOut04'
                - type: array
                  items:
                    $ref: '#/components/schemas/CatchmentOut02'
                - type: array
                  items:
                    $ref: '#/components/schemas/CatchmentOut01'
                - type: 'null'
                title: Response Post Search Catchment Catchment Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /catchment/{id}/downstream:
    get:
      tags:
      - catchment
      summary: Get Downstream
      description: Get catchment(s) that are downstream of target catchment.
      operationId: get_downstream_catchment__id__downstream_get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Catchment ID. Can be obtained via the catchment search endpoints.
          title: Id
        description: Catchment ID. Can be obtained via the catchment search endpoints.
        example: '840270000000099'
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Number of results to return
          title: Limit
        description: Number of results to return
      - name: apikey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: apikey
