      operationId: get_downstream_geometry_catchment__id__downstream_geometry_get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Catchment ID. Can be obtained via the catchment search endpoints.
          title: Id
        description: Catchment ID. Can be obtained via the catchment search endpoints.
        example: '840270000000099'
      - name: union
        in: query
        required: false
        schema:
          type: boolean
          description: Combine multiple GeoJSON Polygon Features into a single GeoJSON Polygon or MultiPolygon
          default: false
          title: Union
        description: Combine multiple GeoJSON Polygon Features into a single GeoJSON Polygon or MultiPolygon
        example: false
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Number of results to return
          title: Limit
        description: Number of results to return
