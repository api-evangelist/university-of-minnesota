  - surface: UMedia Digital Collections JSON API
    x-operator: institution
    versioning: none
    detail: >-
      The API is a JSON representation of the search UI reached by appending ".json" to a path.
      There is no version segment, no version header, and no published deprecation policy — the
      contract is whatever the UI currently returns.
    stability_risk: >-
      Field names are Solr/Blacklight index fields (collection_name_s, creator_ss, subject_ss).
      They can change with a reindex without any versioning signal to consumers.
  - surface: UMN Digital Conservancy / DRUM
    x-operator: institution
    versioning: product
    detail: >-
      Versioning follows the DSpace release train; the running version self-reports as DSpace 10.0
      at /server/api. The legacy /oai/request path now 403s at the WAF while /server/oai/request
      answers, which is a DSpace 7+ path migration the University has not documented publicly.
    deprecation_policy_published: false
  - surface: Common Good APIs
    x-operator: institution
    versioning: unknown
    detail: >-
      Base URL https://integration-boomi.umn.edu/prd/ws/rest/ carries an environment segment
      ("prd") but no version segment. Per-API Swagger lives inside the tenant Boomi developer
      portal and was not anonymously readable, so no version statement could be evidenced.
    deprecation_policy_published: false
  - surface: Institutional identity (Shibboleth IdP)
    x-operator: federation
    versioning: metadata-validUntil
    detail: >-
      InCommon signs and re-publishes the University's entity descriptor with a rolling
      validUntil; the copy captured on 2026-09-01 was valid until 2026-09-15T19:37:27Z. This is a
      real, machine-readable freshness contract — and it is the only one the institution has.
