  - date: '2026-09-01'
    rating: 4
    summary: >-
      Re-profiled under the university pipeline with the operator axis settled before anything was
      saved. The June 2026 profile had three surfaces and no contracts; this pass resolved ten
      surfaces and found the University's one genuine first-party API programme. GEMS Informatics
      publishes nine live OpenAPI 3.1 documents at exchange-1.gems.msi.umn.edu (soil, climate,
      hydro, elevation, landcover, crop, market, biotic-risk, pedtools), all with UMN contacts, on
      an IP inside the University's own 128.101.0.0/16 space; a tenth API, weather, gates its own
      openapi.json behind the api key and could not be saved. Two corrections to the June profile:
      the "UMedia JSON and IIIF" surface was split, because IIIF image delivery is served by the
      Libraries' OCLC CONTENTdm instance and is a tenant surface, not the University's; and the
      Common Good API base host was found not to resolve on public DNS at all. Three registry
      memberships (DataCite direct member UMN, Crossref member 10551, ROR 017zqws13) and one
      identity federation (InCommon urn:mace:incommon:umn.edu, Shibboleth IdP at login.umn.edu)
      were recorded — the federation entry is the strongest institution-operated machine-readable
      surface the University has and was entirely absent from the June profile. No vendor contract
      was saved: the DSpace REST API is DSpace's product contract and the Common Good Swagger
      lives only inside the University's tenant Boomi portal, which answered no anonymous path.
