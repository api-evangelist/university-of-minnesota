  detail: >-
    Re-profiled on 2026-09-01 under the university pipeline with the operator axis settled before
    anything was saved. Ten programmable surfaces were resolved: four institution-operated, two
    tenant, three registry memberships and one identity federation. Nine first-party OpenAPI 3.1
    documents were found live at exchange-1.gems.msi.umn.edu and saved with pristine copies under
    openapi/_original/; a tenth GEMS API (weather) is real but gates its own openapi.json behind
    the api key. One derived contract was written for the UMedia JSON API, which UMN Libraries
    documents in prose but does not publish machine-readably, and it is marked derived. Two
    surfaces were NOT saved as contracts on purpose: the Common Good API Swagger, which exists only
    inside the University's tenant Boomi developer portal and answered no anonymous path, and the
    Digital Conservancy REST API, whose contract is DSpace's product contract rather than the
    University's. The UMedia IIIF image API was split out from the metadata API and re-labelled
    tenant, because it is served by the Libraries' OCLC CONTENTdm instance at
    cdm16022.contentdm.oclc.org and is OCLC's engineering, not the University's. A DNS pass was
    run over every institution host: umedia.lib.umn.edu and conservancy.umn.edu both CNAME to a
    University-owned Azure Front Door endpoint, which is CDN infrastructure rather than a vendor
    platform tenancy, so their operator stays institution; exchange-1.gems.msi.umn.edu resolves
    into the University's own 128.101.0.0/16 address space; and umn-prod-apigw.boomi.cloud
    resolves to an AWS load balancer named umnprodgw, confirming the Boomi portal as a dedicated
    UMN tenancy rather than a shared vendor host. Two institution hosts return 403 from an Azure
    Front Door WAF to a non-browser client while their machine-readable paths answer 200; both are
    recorded as live and bot-blocked, not as dead.
