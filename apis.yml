aid: university-of-minnesota
name: University of Minnesota
description: >-
  The University of Minnesota is a public land-grant research university with its
  flagship campus in the Twin Cities (Minneapolis-Saint Paul), ranked #203 in the
  QS World University Rankings 2025. Its developer/API footprint is led by the OIT
  Integrations Team, which publishes a suite of "Common Good APIs" sourced from the
  University's Common Data Layer (CDL) covering person, HR, student, class, and
  organization data; access requires request and data-custodian approval. Additional
  public-facing APIs include the University Libraries digital collection APIs (UMedia
  JSON and IIIF) and GEMS Informatics agricultural/geospatial data APIs. Most data
  APIs are gated behind access requests and institutional authentication.
