  - aid: university-of-minnesota:gems-exchange-apis
    name: GEMS Informatics Exchange APIs
    description: >-
      A collection of agricultural and geospatial data APIs from GEMS Informatics at
      the University of Minnesota, including Climate, Weather, Soils, Hydro, Elevation,
