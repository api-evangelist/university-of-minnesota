  - aid: university-of-minnesota:boomi-api-developer-portal
    name: Boomi API Developer Portal (UMN tenant)
    x-operator: tenant
    description: >-
      The University's developer portal for the Common Good APIs runs as a UMN-specific tenant on
      Boomi's cloud at umn-prod-apigw.boomi.cloud, where it catalogues twenty-four APIs and holds
      their Swagger documentation. The catalogue and its contents are the University's; the portal
      software, its hosting and its contract are Boomi's. Recorded as a tenancy so the
      relationship is legible without crediting the University for Boomi's engineering — and
      without crediting Boomi with the University's data APIs, which run on umn.edu.
    humanURL: https://umn-prod-apigw.boomi.cloud:18077/#catalog
    baseURL: https://umn-prod-apigw.boomi.cloud:18077
    tags: [ Developer Portal, API Gateway, Integration, Tenant ]
    properties:
      - type: DeveloperPortal
        url: https://umn-prod-apigw.boomi.cloud:18077/#catalog
  - aid: university-of-minnesota:contentdm-iiif
    name: UMedia IIIF image delivery (OCLC CONTENTdm tenant)
    x-operator: tenant
    description: >-
      UMedia's digital objects are delivered over the IIIF Image API 2.1 from the Libraries' OCLC
      CONTENTdm instance at cdm16022.contentdm.oclc.org, which every UMedia record points to in
      its `object` and `thumb_cdn_url` fields. The collections and the tenancy are the
      University's; the IIIF implementation and its conformance are OCLC's. Previously catalogued
      as part of a single University-operated "UMedia JSON and IIIF" surface, which credited the
      University with a vendor's implementation.
    humanURL: https://github.com/UMNLibraries/digital_collection_apis
    baseURL: https://cdm16022.contentdm.oclc.org/digital/iiif/
    tags: [ IIIF, Digital Collections, Images, CONTENTdm, Tenant ]
    properties:
      - type: Documentation
        url: https://github.com/UMNLibraries/digital_collection_apis
