apis:
  - aid: university-of-minnesota:common-good-apis
    name: Common Good APIs
    description: >-
      A suite of APIs published by the OIT Integrations Team providing access to
      frequently used and requested University data sourced from the Common Data
      Layer (CDL). Includes Person Basic Information, Class Information, Employee
      Information, Student Academic, Organization Information, HR Information, Term
      Information, and more. Public-classified APIs require minimal approval;
      private/restricted/highly-restricted APIs require data-custodian approval.
      Endpoints are served from a Boomi integration gateway.
    humanURL: https://sites.google.com/umn.edu/integration-apis/common-good-apis
