  - aid: university-of-minnesota:incommon-identity-federation
    name: InCommon Identity Federation — University of Minnesota Shibboleth IdP
    x-operator: federation
    description: >-
      The University operates its own Shibboleth identity provider and publishes it through the
      InCommon federation as entityID urn:mace:incommon:umn.edu, with shibmd:Scope umn.edu and
      SAML 2.0 single sign-on endpoints at login.umn.edu. The metadata host is shared because a
      federation is shared by definition; the identity provider behind it is entirely the
      institution's, and it is the machine-readable surface the largest number of University
      systems actually depend on.
    humanURL: https://incommon.org
    baseURL: https://mdq.incommon.org/entities/urn%3Amace%3Aincommon%3Aumn.edu
    tags: [ Identity Federation, Shibboleth, SAML, InCommon, Single Sign-On ]
