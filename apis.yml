apis:
  - aid: university-of-minnesota:gems-exchange-apis
    name: GEMS Informatics Exchange APIs
    x-operator: institution
    description: >-
      Ten agricultural, climate and geospatial data APIs operated by GEMS Informatics at the
      University of Minnesota — biotic risk, climate, crop calendar, elevation, hydrology, land
      cover, market accessibility, pedigree tools, soils and weather. Each is a separately
      versioned FastAPI deployment behind one gateway, and nine of the ten publish a live OpenAPI
      3.1 document anonymously. Data paths require an `apikey` header obtained from the GEMS
      portal; the contracts do not declare that requirement. This is the only surface where the
      University publishes machine-readable contracts of its own.
    humanURL: https://gems.umn.edu/gems-exchange-apis
    baseURL: https://exchange-1.gems.msi.umn.edu
    tags: [ Geospatial, Agriculture, Climate, Weather, Soils, Research Data, Open Data ]
