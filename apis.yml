aid: university-of-minnesota
name: University of Minnesota
x-type: university
x-category: Public Research University
description: >-
  The University of Minnesota is a public land-grant research university whose flagship campus is
  in the Twin Cities. Its programmable footprint is small, real, and unevenly distributed: the one
  place it publishes machine-readable contracts of its own is GEMS Informatics, whose Exchange
  APIs serve agricultural, climate and geospatial data from exchange-1.gems.msi.umn.edu behind an
  api key and ship nine live OpenAPI 3.1 documents. Everything else is either gated, undocumented
  in machine terms, or somebody else's contract running under the University's name. The OIT
  Integrations Team's Common Good APIs are institution-operated at integration-boomi.umn.edu but
  are approved per data custodian and their Swagger lives inside a tenant Boomi developer portal
  that answers no anonymous request. UMN Libraries operates a genuine JSON API over the UMedia
  digital collections and an OAI-PMH 2.0 endpoint for the Digital Conservancy, but publishes no
  contract for either, and UMedia's image delivery runs on the Libraries' OCLC CONTENTdm tenancy
  rather than on University infrastructure. The strongest institution-operated machine-readable
  surface the University has is not an API at all: it is the Shibboleth identity provider it
  publishes through InCommon as urn:mace:incommon:umn.edu. There is no central developer portal,
  no institution-wide API catalog, and no public API programme.
