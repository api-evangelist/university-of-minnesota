      - type: JSONSchema
        url: json-schema/university-of-minnesota-umedia-item.json
  - aid: university-of-minnesota:digital-conservancy-oai-pmh
    name: UMN Digital Conservancy — OAI-PMH and DSpace REST
    x-operator: institution
    description: >-
      The University of Minnesota Digital Conservancy, which also holds DRUM (Data Repository for
      the University of Minnesota), runs DSpace 10.0 on University infrastructure. Its OAI-PMH 2.0
      endpoint answers anonymously under the University's own repositoryIdentifier
      (conservancy.umn.edu) with a umn.edu admin contact, and its DSpace REST root is publicly
      readable for communities and collections while item endpoints require authentication. The
      deployment is the institution's; the REST contract is DSpace's product contract, so none is
      saved here.
    humanURL: https://conservancy.umn.edu
    baseURL: https://conservancy.umn.edu/server/oai/request
    tags: [ Research Repository, OAI-PMH, DSpace, Open Access, Research Data ]
    properties:
