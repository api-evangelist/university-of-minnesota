  - aid: university-of-minnesota:common-good-apis
    name: Common Good APIs
    x-operator: institution
    description: >-
      A suite of APIs published by the OIT Integrations Team over the University's Common Data
      Layer — person, class, employee, student academic, organization, HR and term information.
      Served from a University-hosted Boomi integration gateway at integration-boomi.umn.edu, so
      the runtime is the institution's. Access is graded by the University's own data
      classification (public, private, restricted, highly restricted) and granted per data
      custodian. Per-API Swagger exists only inside the University's tenant Boomi developer
      portal; no anonymous path to it was reachable, so no contract for these APIs is held here.
      The documented base host does not resolve on public DNS (NXDOMAIN at 8.8.8.8), so the
      surface is institution-operated but reachable only from inside the University network.
    humanURL: https://sites.google.com/umn.edu/integration-apis/common-good-apis
    baseURL: https://integration-boomi.umn.edu/prd/ws/rest/
    tags: [ Integration, Students, HR, Employee, Identity, Education ]
    tags_raw: [ Integration, Student, HR, Employee, Identity, Education ]
    properties:
      - type: Documentation
        url: https://sites.google.com/umn.edu/integration-apis/common-good-apis
      - type: Signup
        url: https://sites.google.com/umn.edu/integration-apis/home
  - aid: university-of-minnesota:umedia-digital-collections
    name: UMedia Digital Collections JSON API
    x-operator: institution
    description: >-
      A read-only JSON API over UMedia, the University of Minnesota Libraries digital collections
      platform. Any search or item URL returns JSON when ".json" is appended, with Blacklight
      bracket facet syntax for filtering and a `rows` parameter that is how bulk metadata export
      is performed. UMN Libraries documents it in a public repository but publishes no contract;
      the OpenAPI in this repository is derived by API Evangelist from live responses and is
      marked as such. Image delivery is NOT part of this surface — see the CONTENTdm IIIF entry.
    humanURL: https://github.com/UMNLibraries/digital_collection_apis
    baseURL: https://umedia.lib.umn.edu
    tags: [ Library, Digital Collections, Metadata, Open Data, Research Data ]
    properties:
      - type: Documentation
        url: https://github.com/UMNLibraries/digital_collection_apis
      - type: GitHub
        url: https://github.com/UMNLibraries/digital_collection_apis
      - type: OpenAPI
